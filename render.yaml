services:
  - type: web
    name: ktor-api
    env: java
    plan: free
    buildCommand: ./gradlew installDist
    startCommand: ./build/install/futmatch/bin/futmatch
    envVars:
      - key: PORT
        value: 8080
      - key: KTOR_DEVELOPMENT
        value: "false"
      - key: TEST_FORCE_COUNTRY_UPDATE_ERROR
        value: "false"
